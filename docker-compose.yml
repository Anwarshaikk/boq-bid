version: '3.9'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend/app
    working_dir: /app
    command: ["flask", "run", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    environment:
      - FLASK_APP=main:app
      - FLASK_DEBUG=1
      - REDIS_HOST=redis
      - GEMINI_API_KEY=AIzaSyBkTZec45xKznqxT-x-pAX9v9Ow6t3wDC4
    volumes:
      # This correctly mounts your code for live updates
      - ./backend/app:/app
    depends_on:
      - redis

  worker:
    build:
      context: ./backend/app
    working_dir: /app
    command: ["python", "worker.py"]
    environment:
      - REDIS_HOST=redis
      - GEMINI_API_KEY=AIzaSyBkTZec45xKznqxT-x-pAX9v9Ow6t3wDC4
    volumes:
      - ./backend/app:/app
    depends_on:
      - redis

  frontend:
    build: ./frontend
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8080
    volumes:
      - ./frontend:/app
      # This is crucial to prevent the container's node_modules from being overwritten
      - /app/node_modules
    depends_on:
      - backend
